<div id="WindowBundle" class="ui-window">
    <h3 style="margin-bottom:20px">Bundle</h3>
    <div style="clear: both;"></div>
    <div class="div-flex">
    <span class="span-align-bundle" for="fat">Fat (g)</span>
    <input class="input-minimized" type="number" id="fat_bundle" placeholder="Fat (g)" value="0" disabled>
    <div></div>
    <span class="span-align-bundle" for="carbs">Carbs (g)</span>
    <input class="input-minimized" type="number" id="carbs_bundle" placeholder="Carbs (g)" value="0" disabled>
   <div></div>
    <span class="span-align-bundle" for="protein">Protein (g)</span>
    <input class="input-minimized" type="number" id="protein_bundle" placeholder="Protein (g)" value="0" disabled>
   <div></div>
    <span class="span-align-bundle" for="multiplier">Weight (100g):</span>
    <input class="input-minimized" type="number" id="weight_bundle" placeholder="Total weight" value="0" disabled>
   <div></div>
    <span class="span-align-bundle" for="comment">Comment</span>
    </div>
    <textarea id="comment_bundle" placeholder="Describe food nuance..."></textarea>

    <button class="subtle" onclick="window.MacroAdder.Act.user_bundle_clear()">Clear bundle</button>
    <button class="subtle" onclick="window.MacroAdder.Act.user_bundle_undo()">Undo last entry</button>
</div>
