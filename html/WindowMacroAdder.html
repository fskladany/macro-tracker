<div id="WindowMacroAdder" class="ui-window">
    <h1 style="margin-bottom:20px">Macro Tracker</h1>


    <label for="templateSelect" style="float: left">Choose an ingredient variant:</label>
    <div id="search-Element-container" class="ct-select">
        <select id="search-Element-Bar" style="display:none" onchange="window.MacroTracker.handleFoodItemSelection()">
            <option value="">Manual template...</option>
        </select>

        <header class="search-Element-base-option">
            <img class="search-Element-base-image" src="res/unknown.png" alt="thumb" />
            <div>Choose an ingredient variant...</div>
            <span>&#8597;</span>
        </header>

        <aside class="search-Element-dropdown-container">
            <section class="search-Element-userinput-container">
                <input type="text" placeholder=" 🔍 Search ingredient..." autocomplete="off">
            </section>
            <section class="search-Element-Dropdown-Items-Section"></section>
        </aside>
    </div>

    <div style="clear: both;"></div>
    <div id="macro-actions-row">
        <button onclick="window.MacroAdder.Act.user_add_record()"> Eat </button>
        <button onclick="window.MacroAdder.Act.user_bundle_item()"> Bundle </button>

    </div>

    <label for="fat">Fat (g)</label>
    <input type="number" id="fat" placeholder="Fat (g)" value="0">

    <label for="carbs">Carbs (g)</label>
    <input type="number" id="carbs" placeholder="Carbs (g)" value="0">

    <label for="protein">Protein (g)</label>
    <input type="number" id="protein" placeholder="Protein (g)" value="0">

    <label for="multiplier">Amount (100g):</label>
    <input type="number" id="multiplier" placeholder="1=100g" step="0.3333" value="0">

    <label for="comment">Comment</label>
    <textarea id="comment" placeholder="Describe food nuance..."></textarea>

    <button class="subtle" onclick="window.MacroAdder.Act.user_undo_last_entry()">Undo Eat</button>
</div>
