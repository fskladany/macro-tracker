<div id="syncWindow" class="draggable ui-window hidden init-draggable">
    <div class="anchor-group">
        <div class="anchor" id="sync-win-1"> 📀 </div>
    </div>
    <h1>User Sync</h1>

    <div class="user-management">
        <label for="userSelect">Current User:</label>
        <select id="userSelect" onchange="window.Sync.switchUser(this.value)"></select>
        <button class="subtle" onclick="window.Sync.addUser()">+ Add User</button>
    </div>

    <p>Push your local changes and pull updates from other users.</p>

    <div class="sync-actions">
        <button onclick="window.Sync.syncWithServer()">Sync with Server</button>
    </div>

    <div id="syncStatus" class="sync-status">Not synced yet.</div>
</div>
