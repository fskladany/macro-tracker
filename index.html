<!DOCTYPE html>
<html lang="mixed">
<head>
	<title>Macro Tracker</title>
	<meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<link rel="stylesheet" href="aesthetics/ui.Class.css">
	<link rel="stylesheet" href="aesthetics/ui.Component.Color.css">
	<link rel="stylesheet" href="aesthetics/ui.Component.Search.css">
	<link rel="stylesheet" href="aesthetics/ui.Element.css">
	<link rel="stylesheet" href="aesthetics/ui.Element.extension.css">
	<link rel="stylesheet" href="aesthetics/ui.Layout.css">
	<link rel="stylesheet" href="aesthetics/ui.Window.MacroAdder.css">
	<link rel="stylesheet" href="aesthetics/ui.Window.StatHistory.css">
	<link rel="stylesheet" href="aesthetics/ui.Window.StatConsumption.css">
	
	<script src="DOM.js"></script>
	<script src="ingredients.js"></script>
	<script src="MacroAdder.Act.js"></script>
	<script src="MacroAdder.Calc.js"></script>
	<script src="MacroAdder.Template.js"></script>
	<script src="MacroAdder.Repaint.js"></script>

	<script src="MacroAdder.js"></script>
	<script>

		// This forced me to python -m http.server
		// This decision is not final
		function loadWindow(windowId, targetDiv) {
			fetch('html/' + windowId + '.html')
				.then(response => response.text())
				.then(html => {
					//console.log(html);
					const targetDivElem = document.getElementById(targetDiv);

					if (!targetDivElem) {
						throw new Error(`Window element not found by id: ${targetDiv}`);
					}

					const template = document.createElement('template');
					template.innerHTML = html;

					const nNodes = template.content.childNodes.length;

					template.content.childNodes.forEach(childNone => {
						console.log(childNone);
						targetDivElem.appendChild(childNone);
					})

				})
				.catch(error => {
					alert(`Error loading ${windowId}: ${error}`);
				})


		}

		// Load external windows
		loadWindow('WindowStatHistory', 'externalWindowContainer');
		loadWindow('WindowStatConsumption', 'externalWindowContainer');
		loadWindow('WindowMacroAdder', 'externalWindowContainer');

		// Call this function on page load to populate the select dropdown
		document.addEventListener('DOMContentLoaded', function () {
			setTimeout(() => {
				window.MacroAdder.Init.loadMainMacroWindow();
				window.MacroAdder.Repaint.frontend_repaint_WindowStatHistory_table_repaint();
				window.MacroAdder.Repaint.frontend_repaint_WindowStatConsumption_window();
			}, 1000);

		});


	</script>
</head>

<body>
	<div id="externalWindowContainer">
		<!-- Loaded external windows will appear here -->
	</div>
</body>

</html>
